name: release

# Push a tag like v0.2.1 to publish a GitHub release. The tag must match the
# version in plugin.json and marketplace.json, and CHANGELOG.md must have a
# "## [0.2.1]" section, which becomes the release notes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check tag matches plugin version
        run: |
          plugin=$(node -p "require('./plugins/collab/.claude-plugin/plugin.json').version")
          market=$(node -p "require('./.claude-plugin/marketplace.json').plugins[0].version")
          if [ "v$plugin" != "$GITHUB_REF_NAME" ] || [ "v$market" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.json ($plugin) / marketplace.json ($market)"
            exit 1
          fi

      - run: npm test

      - name: Extract release notes
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::No CHANGELOG.md section for ${GITHUB_REF_NAME#v}"
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
